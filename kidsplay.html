<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7cc8f8">
<title>꼬마 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --ink: #2b2d42;
    --blue: #4a8ff0;
    --pink: #ff6b9a;
    --yellow: #ffd23f;
    --px: "Galmuri11", "Apple SD Gothic Neo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--px); color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
    background: linear-gradient(#7cc8f8 0 28%, #8dd0fa 28% 46%, #a2d9fb 46% 62%, #b8e3fd 62% 76%, #cdecfe 76%);
  }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  canvas { display: block; }

  /* ---------- 하늘 & 땅 ---------- */
  #sky { position: fixed; inset: 0; pointer-events: none; }
  #sky span { position: absolute; line-height: 0; animation: drift 10s ease-in-out infinite alternate; }
  #sky span:nth-child(2n) { animation-duration: 14s; }
  @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
  #ground { position: fixed; left: 0; right: 0; bottom: 0; height: 84px; pointer-events: none; display: none; }
  body.ground #ground { display: block; }
  #groundCv { position: absolute; left: 0; bottom: 0; image-rendering: pixelated; }
  #ground .sprite { position: absolute; bottom: 74px; line-height: 0; }

  /* ---------- 픽셀 테두리 공통 ---------- */
  .card {
    background: #fff;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
                0 9px 0 rgba(43,45,66,.18);
  }
  .pbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 15px; font-weight: 700; padding: 10px 18px; background: #fff;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
                inset 0 -4px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.6), 0 7px 0 rgba(43,45,66,.25);
  }
  .pbtn:active { transform: translateY(3px); }
  .pbtn.blue { background: var(--blue); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .pbtn.pink { background: var(--pink); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .pbtn.sm { font-size: 13px; padding: 7px 12px; }

  .ribbon {
    display: inline-block; background: var(--pink); color: #fff; font-size: 13px; font-weight: 700;
    padding: 7px 24px; text-shadow: 1px 1px 0 rgba(43,45,66,.6);
    clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 50%, 100% 100%, 0 100%, 9px 50%);
  }
  .title {
    font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 1px;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
                 3px 3px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink),
                 0 7px 0 var(--ink);
  }

  /* ---------- 화면 ---------- */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.active { display: flex; }
  .bar { position: relative; flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .bar .ribbon { position: absolute; left: 50%; transform: translateX(-50%); }
  .bar-r { display: flex; gap: 4px; align-items: center; min-width: 60px; justify-content: flex-end; }

  /* 홈 */
  #home { align-items: center; justify-content: center; padding-bottom: 90px; gap: 14px; }
  .stars { display: flex; gap: 8px; align-items: flex-end; }
  .stars span:nth-child(2) { transform: translateY(-6px); }
  .choices { display: flex; gap: 34px; margin-top: 26px; }
  .choice { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .choice .card { padding: 12px; }
  .choice .pv { height: 150px; display: grid; place-items: center; }
  .choice .pv canvas { height: 150px; width: auto; }
  .choice:active .card { transform: translateY(3px); }

  /* 고르기 */
  .pick-main { flex: 1; display: grid; place-items: center; padding: 6px 20px 100px; min-height: 0; }
  .grid { display: grid; gap: 18px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 8px 10px; }
  .tile canvas { width: 100%; height: auto; }
  .tile .nm { font-size: 14px; font-weight: 700; }
  .tile:active { transform: translateY(3px); }
  .tile.locked { background: #eef1f7; cursor: default; }
  .tile.locked:active { transform: none; }
  .tile .q { width: 100%; display: grid; place-items: center; color: #b6bccc; font-size: 30px; font-weight: 700; }
  .tile.locked .nm { color: #9aa1b5; }
  .tile .soon { font-size: 11px; color: #9aa1b5; margin-top: -4px; }

  /* 색칠 */
  .color-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 4px 20px 22px; }
  .color-main.land { flex-direction: row; gap: 28px; }
  .board { padding: 10px; }
  .palette { padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .now { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  #nowSwatch { width: 30px; height: 30px; box-shadow: 0 0 0 3px var(--ink); }
  .swatches { display: grid; grid-template-columns: repeat(3, 54px); gap: 12px; }
  .color-main:not(.land) .swatches { grid-template-columns: repeat(8, 46px); gap: 10px; }
  .color-main:not(.land) .palette { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .sw { width: 100%; aspect-ratio: 1; box-shadow: 0 0 0 3px var(--ink), inset 0 -4px 0 rgba(0,0,0,.15); }
  .sw.sel { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px #fff, 0 0 0 9px var(--ink); }
  .tools { display: flex; gap: 14px; margin-top: 4px; }

  /* 틀린그림 */
  .spot-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 4px 20px 22px; }
  .spot-main.land { flex-direction: row; }
  .pic { position: relative; padding: 6px; }
  .pic canvas { touch-action: none; }
  .miss { position: absolute; font-size: 26px; font-weight: 700; color: #ff3b6b; pointer-events: none;
    transform: translate(-50%, -50%); text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
    animation: miss .7s ease-out forwards; }
  @keyframes miss { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); } 30% { transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; } }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #progress span { line-height: 0; }

  /* 축하 */
  #celebrate { position: fixed; inset: 0; display: none; place-items: center; background: rgba(43,45,66,.35); z-index: 20; }
  #celebrate.show { display: grid; }
  #celebrate .card { padding: 26px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: popin .35s ease-out; }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ctext { font-size: 20px; font-weight: 700; }
  .csub { font-size: 13px; color: #7a8099; margin-top: -6px; }
  .cbtns { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .confetti { position: fixed; top: -12px; width: 10px; height: 10px; z-index: 21; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  @media (max-width: 700px) {
    .choices { gap: 18px; }
    .choice .pv, .choice .pv canvas { height: 110px; }
    .title { font-size: 26px; }
  }
</style>
</head>
<body class="ground">

<div id="sky"></div>
<div id="ground"><canvas id="groundCv"></canvas></div>

<!-- 1. 첫 화면 -->
<section id="home" class="screen active">
  <div class="stars"><span data-pix="star" data-px="3"></span><span data-pix="star" data-px="4"></span><span data-pix="star" data-px="3"></span></div>
  <div class="ribbon">오늘은 뭐 하고 놀까?</div>
  <h1 class="title">꼬마 놀이터</h1>
  <div class="choices">
    <button class="choice" data-go="colorPick">
      <div class="card"><div class="pv"><canvas id="pvColor"></canvas></div></div>
      <span class="pbtn blue">색칠하기</span>
    </button>
    <button class="choice" data-go="spotPick">
      <div class="card"><div class="pv"><canvas id="pvSpot"></canvas></div></div>
      <span class="pbtn pink">틀린그림찾기</span>
    </button>
  </div>
</section>

<!-- 2-1. 동물 고르기 -->
<section id="colorPick" class="screen">
  <div class="bar"><button class="pbtn sm" data-go="home">◀ 뒤로</button><div class="ribbon">누구를 색칠할까?</div><div class="bar-r"></div></div>
  <div class="pick-main"><div class="grid" id="animalGrid"></div></div>
</section>

<!-- 2-2. 장소 고르기 -->
<section id="spotPick" class="screen">
  <div class="bar"><button class="pbtn sm" data-go="home">◀ 뒤로</button><div class="ribbon">어디로 가 볼까?</div><div class="bar-r"></div></div>
  <div class="pick-main"><div class="grid" id="placeGrid"></div></div>
</section>

<!-- 3-1. 색칠하기 -->
<section id="color" class="screen">
  <div class="bar"><button class="pbtn sm" data-go="colorPick">◀ 뒤로</button><div class="ribbon" id="colorTitle"></div>
    <div class="bar-r"><button class="pbtn sm" id="resetBtn">처음부터</button></div></div>
  <div class="color-main" id="colorMain">
    <div class="card board"><canvas id="colorCv"></canvas></div>
    <div class="card palette">
      <div class="now"><span id="nowSwatch"></span>이 색으로 칠해요</div>
      <div class="swatches" id="swatches"></div>
      <div class="tools"><button class="pbtn sm blue" id="saveColor">저장하기</button></div>
    </div>
  </div>
</section>

<!-- 3-2. 틀린그림찾기 -->
<section id="spot" class="screen">
  <div class="bar"><button class="pbtn sm" data-go="spotPick">◀ 뒤로</button><div class="ribbon" id="spotTitle"></div>
    <div class="bar-r" id="progress"></div></div>
  <div class="spot-main" id="spotMain">
    <div class="card pic" id="picA"><canvas id="cvA"></canvas></div>
    <div class="card pic" id="picB"><canvas id="cvB"></canvas></div>
  </div>
</section>

<div id="celebrate"><div class="card">
  <div class="stars"><span data-pix="star" data-px="4"></span><span data-pix="star" data-px="5"></span><span data-pix="star" data-px="4"></span></div>
  <p class="ctext" id="cText"></p>
  <p class="csub" id="cSub"></p>
  <div class="cbtns" id="cBtns"></div>
</div></div>

<script>
// =====================================================================
//  그림 엔진: 도형으로 칸(영역)을 나누고, 칸 단위로 색을 칠해요
// =====================================================================
const INK = '#2b2d42';
const R = (k, x, y, w, h, c, o = {}) => ({ t: 'r', k, x, y, w, h, c, ...o });
const E = (k, x, y, rx, ry, c, o = {}) => ({ t: 'e', k, x, y, rx, ry, c, ...o });
const P = (k, pts, c, o = {}) => ({ t: 'p', k, pts, c, ...o });
const ink = (x, y, w, h, o = {}) => R('ink', x, y, w, h, null, { fix: INK, ...o });
const hl = (x, y, o = {}) => R('hl', x, y, 1, 1, null, { fix: '#ffffff', ...o });
// 좌우 대칭 (64칸 그림 기준)
const mirror = s => s.t === 'r' ? { ...s, x: 64 - s.x - s.w } : s.t === 'e' ? { ...s, x: 64 - s.x } : { ...s, pts: s.pts.map(([x, y]) => [64 - x, y]) };
const sym = s => [s, mirror(s)];
const starPts = (cx, cy, Ro, Ri) => Array.from({ length: 10 }, (_, i) => {
  const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? Ri : Ro;
  return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
});

function hit(s, px, py) {
  if (s.t === 'r') return px >= s.x && px < s.x + s.w && py >= s.y && py < s.y + s.h;
  if (s.t === 'e') { const dx = (px - s.x) / s.rx, dy = (py - s.y) / s.ry; return dx * dx + dy * dy <= 1; }
  let inside = false; const p = s.pts;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function bounds(s) {
  if (s.t === 'r') return [s.x, s.y, s.x + s.w, s.y + s.h];
  if (s.t === 'e') return [s.x - s.rx, s.y - s.ry, s.x + s.rx, s.y + s.ry];
  const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

function build(def, variant = 'A') {
  const { w, h } = def;
  const map = new Uint16Array(w * h);
  const regions = [{ k: 'bg', col: def.bg || null, fix: null, nl: false }];
  const idx = { bg: 0 }, dbox = {};
  for (const s of def.shapes) {
    const active = !s.only || s.only === variant;
    if (active && !(s.k in idx)) { idx[s.k] = regions.length; regions.push({ k: s.k, col: s.c, fix: s.fix || null, nl: !!s.nl }); }
    const ri = idx[s.k];
    if (active && variant === 'B' && s.cB) regions[ri].col = s.cB;
    const clip = s.clip ? [].concat(s.clip).map(k => idx[k]) : null;
    const [x0, y0, x1, y1] = bounds(s);
    for (let y = Math.max(0, Math.floor(y0)); y <= Math.min(h - 1, Math.ceil(y1)); y++)
      for (let x = Math.max(0, Math.floor(x0)); x <= Math.min(w - 1, Math.ceil(x1)); x++) {
        if (!hit(s, x + .5, y + .5)) continue;
        if (s.d !== undefined) {
          const b = dbox[s.d] || (dbox[s.d] = { x0: x, y0: y, x1: x, y1: y });
          b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y); b.x1 = Math.max(b.x1, x); b.y1 = Math.max(b.y1, y);
        }
        if (!active) continue;
        const i = y * w + x;
        if (clip && !clip.includes(map[i])) continue;
        map[i] = ri;
      }
  }
  // 칸 사이 테두리 선 미리 계산
  const edges = [];
  const ok = (a, b) => a !== b && !regions[a].fix && !regions[b].fix && !(regions[a].nl && regions[b].nl);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, a = map[i];
    if (x < w - 1 && ok(a, map[i + 1])) edges.push(x + 1, y, 0, a === 0 || map[i + 1] === 0 ? 1 : 0);
    if (y < h - 1 && ok(a, map[i + w])) edges.push(x, y + 1, 1, a === 0 || map[i + w] === 0 ? 1 : 0);
  }
  const diffs = Object.keys(dbox).sort().map(k => {
    const b = dbox[k];
    return { x: (b.x0 + b.x1 + 1) / 2, y: (b.y0 + b.y1 + 1) / 2,
             r: Math.min(10, Math.max(5, Math.max(b.x1 - b.x0 + 1, b.y1 - b.y0 + 1) / 2 + 2)) };
  });
  return { w, h, map, regions, edges, diffs };
}
const defaultColors = art => art.regions.map(r => r.fix || r.col);

const rgbCache = {};
function rgb(hex) {
  if (rgbCache[hex]) return rgbCache[hex];
  const n = parseInt(hex.slice(1), 16);
  return (rgbCache[hex] = [n >> 16 & 255, n >> 8 & 255, n & 255]);
}
function draw(ctx, art, colors, cs, opt = {}) {
  const { w, h, map, edges } = art;
  const off = document.createElement('canvas'); off.width = w; off.height = h;
  const octx = off.getContext('2d'), img = octx.createImageData(w, h), d = img.data;
  const cols = colors.map(c => c ? rgb(c) : null);
  for (let i = 0; i < map.length; i++) {
    const c = cols[map[i]]; if (!c) continue;
    d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  ctx.clearRect(0, 0, w * cs, h * cs);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, w * cs, h * cs);
  const thin = opt.thin ?? Math.max(1, cs * .26), thick = opt.thick ?? Math.max(1.5, cs * .42);
  ctx.fillStyle = INK;
  for (let k = 0; k < edges.length; k += 4) {
    const x = edges[k] * cs, y = edges[k + 1] * cs, lw = edges[k + 3] ? thick : thin;
    if (edges[k + 2] === 0) ctx.fillRect(x - lw / 2, y - lw / 2, lw, cs + lw);
    else ctx.fillRect(x - lw / 2, y - lw / 2, cs + lw, lw);
  }
}
function fitCanvas(cv, cw, ch) {
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function preview(cv, def, cs) {
  const art = build(def, 'A');
  cv.width = def.w * cs; cv.height = def.h * cs;
  draw(cv.getContext('2d'), art, defaultColors(art), cs, { thin: cs * .3, thick: cs * .45 });
}

// =====================================================================
//  색칠 도안 (64 x 64 칸)
// =====================================================================
const ANIMALS = [
  { id: 'shark', name: '상어', w: 64, h: 64, shapes: [
    P('tail', [[40, 50], [50, 49], [57, 44], [60, 47], [56, 53], [61, 58], [57, 61], [49, 56], [40, 56]], '#6fa8e8'),
    E('body', 32, 31, 16, 20, '#6fa8e8'),
    E('belly', 32, 34, 10, 11, '#eaf4ff', { clip: 'body' }),
    R('shirt', 14, 37, 36, 13, '#ffd23f', { clip: ['body', 'belly'] }),
    R('stripe', 14, 42, 36, 3, '#ff6b6b', { clip: 'shirt' }),
    P('shorts', [[18, 47], [46, 47], [47, 55], [34, 55], [32, 52], [30, 55], [17, 55]], '#4a8ff0'),
    ...sym(R('legs', 21, 55, 7, 3, '#6fa8e8')),
    ...sym(R('shoes', 19, 58, 10, 4, '#ff6b6b')),
    ...sym(P('arms', [[18, 37], [7, 45], [9, 48], [19, 43]], '#6fa8e8')),
    P('cap', [[19, 17], [20, 12], [24, 8], [32, 6], [40, 8], [44, 12], [45, 17]], '#ff6b6b'),
    R('brim', 37, 15, 15, 3, '#ffd23f'),
    P('fin', [[27, 9], [33, -1], [37, 8]], '#6fa8e8'),
    ...sym(ink(23, 21, 3, 4)), ...sym(hl(23, 21)),
    ...sym(E('cheeks', 21, 27, 2.6, 1.6, '#ffb3c8')),
    ink(28, 28, 8, 1), ...sym(ink(27, 27, 1, 1)),
  ]},
  { id: 'fox', name: '여우', w: 64, h: 64, shapes: [
    P('tail', [[40, 50], [48, 40], [54, 30], [58, 27], [61, 33], [59, 44], [52, 52], [44, 54]], '#ff9f43'),
    P('tailtip', [[50, 34], [54, 29], [58, 27], [61, 33], [60, 37], [55, 36]], '#ffffff', { clip: 'tail' }),
    ...sym(E('arms', 19, 42, 3.5, 6, '#ff9f43')),
    E('shirt', 32, 40, 11, 10, '#ffffff'),
    ...sym(P('vest', [[20, 32], [29, 32], [29, 50], [20, 49]], '#3cb371', { clip: 'shirt' })),
    E('buttons', 32, 41, 1.6, 1.6, '#ffd23f'), E('buttons', 32, 46, 1.6, 1.6, '#ffd23f'),
    P('pants', [[22, 46], [42, 46], [43, 56], [34, 56], [32, 53], [30, 56], [21, 56]], '#4a8ff0'),
    ...sym(R('shoes', 20, 56, 10, 4, '#a0673a')),
    ...sym(P('ears', [[16, 2], [29, 10], [18, 18]], '#ff9f43')),
    ...sym(P('inner', [[18, 6], [25, 11], [19, 15]], '#ffd1e6', { clip: 'ears' })),
    E('head', 32, 19, 15, 12, '#ff9f43'),
    E('muzzle', 32, 25, 10, 6, '#ffffff', { clip: 'head' }),
    R('scarf', 19, 29, 26, 5, '#ff5a5f'),
    R('scarfend', 36, 33, 6, 10, '#ffd23f'),
    ...sym(ink(23, 15, 3, 4)), ...sym(hl(23, 15)),

function spriteSVG(name, px) {

function drawGround() {
  const px = 4, cv = $('groundCv'), W = Math.ceil(innerWidth / px) + 1, H = 21;
  cv.width = W; cv.height = H; cv.style.width = W * px + 'px'; cv.style.height = H * px + 'px';
  const c = cv.getContext('2d'), hash = (a, b) => ((a * 73856093) ^ (b * 19349663)) >>> 0;
  for (let x = 0; x < W; x++) {
    const top = (x >> 1) % 3 === 0 ? 0 : 1;
    for (let y = top; y < H; y++) {
      let col;
      if (y < 2) col = '#a2e86d';
      else if (y < 5) col = '#6cc04a';
      else if (y === 5) col = (x >> 1) % 2 ? '#4f9a36' : '#6cc04a';
      else col = hash(x >> 1, y >> 1) % 7 === 0 ? '#8a5530' : '#a86d3f';
      c.fillStyle = col; c.fillRect(x, y, 1, 1);
    }
  }
}

let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type = 'sine', vol = .25, slide) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}

  boop: () => tone(220, 0, .18, 'square', .07, 150),

function layoutGrid(grid, cols, rows, aspect) {

function layoutColor() {
  if (!paint) return;
  const m = $('colorMain'), W = m.clientWidth - 40, H = m.clientHeight - 30;
  const land = W > H * 1.15;
  m.classList.toggle('land', land);
  const size = Math.floor(land ? Math.min(H - 20, W - 260) : Math.min(W - 20, H - 210));
  paint.cs = Math.max(3, size) / 64;
  paint.ctx = fitCanvas($('colorCv'), paint.cs * 64, paint.cs * 64);

}
function redrawColor() { draw(paint.ctx, paint.art, paint.colors, paint.cs); }
$('colorCv').addEventListener('pointerdown', e => {
  if (!paint) return;
  const r = e.currentTarget.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * 64), y = Math.floor((e.clientY - r.top) / r.height * 64);
  if (x < 0 || y < 0 || x > 63 || y > 63) return;
  const ri = paint.art.map[y * 64 + x];
  if (paint.art.regions[ri].fix) return;
  paint.colors[ri] = selColor;
  if (ri !== 0) selColor === '#ffffff' ? paint.painted.delete(ri) : paint.painted.add(ri);
  sfx.pop(); redrawColor();
  const need = paint.art.regions.filter((r, i) => i && !r.fix).length;
  if (!paint.done && paint.painted.size >= need) {
    paint.done = true;
    setTimeout(() => celebrate('완성! 참 잘했어요', `${paint.def.name}가 정말 멋져졌어요`, [
      ['계속 칠하기', '', () => $('celebrate').classList.remove('show')],
      ['저장하기', 'blue', saveColor],
      ['다른 친구', 'pink', () => go('colorPick')],

});

async function saveColor() {
  const cs = 12, cv = document.createElement('canvas'); cv.width = cv.height = 64 * cs;
  draw(cv.getContext('2d'), paint.art, paint.colors, cs);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], `색칠_${paint.def.name}_${Date.now()}.png`, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
}

function startSpot(def) {

  $('spotTitle').textContent = `${def.name} 틀린그림찾기`;

function renderProgress() {
  $('progress').innerHTML = spot.diffs.map((_, i) => `<span>${spriteSVG(spot.found.size > i ? 'star' : 'starOff', 2)}</span>`).join('');
}
function layoutSpot() {
  if (!spot) return;
  const m = $('spotMain'), W = m.clientWidth - 40, H = m.clientHeight - 26, gap = 20, pad = 12;
  const land = W / H > 1.1;
  m.classList.toggle('land', land);
  let pw, ph;
  if (land) { pw = Math.min((W - gap) / 2 - pad, (H - pad) * 1.5); ph = pw / 1.5; }
  else { ph = Math.min((H - gap) / 2 - pad, (W - pad) / 1.5); pw = ph * 1.5; }
  spot.cs = Math.floor(pw / 96 * 100) / 100;
  spot.ctxA = fitCanvas($('cvA'), spot.cs * 96, spot.cs * 64);
  spot.ctxB = fitCanvas($('cvB'), spot.cs * 96, spot.cs * 64);
  redrawSpot();
}
function ring(ctx, d, cs) {

    for (let x = Math.floor(d.x - d.r - 2); x <= d.x + d.r + 2; x++) {
      const dist = Math.hypot(x + .5 - d.x, y + .5 - d.y);
      if (Math.abs(dist - d.r) < .75) { ctx.fillStyle = '#ff3b6b'; ctx.fillRect(x * cs, y * cs, cs, cs); }
      else if (Math.abs(dist - d.r - 1) < .5 || Math.abs(dist - d.r + 1) < .5) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x * cs, y * cs, cs, cs); }
    }
}
function redrawSpot() {
  const o = { thin: Math.max(1, spot.cs * .3) };
  draw(spot.ctxA, spot.A, defaultColors(spot.A), spot.cs, o);
  draw(spot.ctxB, spot.B, defaultColors(spot.B), spot.cs, o);
  spot.found.forEach(i => { ring(spot.ctxA, spot.diffs[i], spot.cs); ring(spot.ctxB, spot.diffs[i], spot.cs); });
}
function spotTap(e) {
  if (!spot) return;
  const cv = e.currentTarget, r = cv.getBoundingClientRect();
  const gx = (e.clientX - r.left) / r.width * 96, gy = (e.clientY - r.top) / r.height * 64;
  const i = spot.diffs.findIndex((d, k) => !spot.found.has(k) && Math.hypot(gx - d.x, gy - d.y) <= d.r + 1.5);
  if (i >= 0) {
    spot.found.add(i); sfx.ding(); redrawSpot(); renderProgress();
    if (spot.found.size === spot.diffs.length) setTimeout(() => celebrate('다 찾았어요!', '눈이 정말 좋구나', [
      ['다시 하기', '', () => startSpot(spot.def)],
      ['다른 장소', 'pink', () => go('spotPick')],
    ]), 400);
  } else {
    sfx.boop();
    const m = document.createElement('span'); m.className = 'miss'; m.textContent = '✕';
    m.style.left = (e.clientX - r.left + 6) + 'px'; m.style.top = (e.clientY - r.top + 6) + 'px';
    cv.parentElement.appendChild(m); setTimeout(() => m.remove(), 700);
    cv.parentElement.classList.remove('shake'); void cv.offsetWidth; cv.parentElement.classList.add('shake');
  }
}
$('cvA').addEventListener('pointerdown', spotTap);
$('cvB').addEventListener('pointerdown', spotTap);

// =====================================================================
//  축하 화면
// =====================================================================
function celebrate(title, sub, buttons) {
  sfx.fanfare();
  $('cText').textContent = title; $('cSub').textContent = sub;
  const bx = $('cBtns'); bx.innerHTML = '';
  buttons.forEach(([label, cls, fn]) => {
    const b = document.createElement('button'); b.className = 'pbtn ' + cls; b.textContent = label;
    b.onclick = () => { sfx.tap(); fn(); }; bx.appendChild(b);
  });
  $('celebrate').classList.add('show');
  const cols = ['#ff5a5f', '#ffd23f', '#4a8ff0', '#8ae66b', '#ff8cc6', '#a26bff'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}

// =====================================================================
//  시작
// =====================================================================
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
buildScenery();
preview($('pvColor'), ANIMALS[1], 6);
preview($('pvSpot'), PLACES[0], 5);
makeTiles();
makePalette();
</script>
