<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7cc8f8">
<title>꼬마 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --ink: #2b2d42;
    --blue: #4a8ff0;
    --pink: #ff6b9a;
    --yellow: #ffd23f;
    --px: "Galmuri11", "Apple SD Gothic Neo", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--px); color: var(--ink);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
    background: linear-gradient(#7cc8f8 0 28%, #8dd0fa 28% 46%, #a2d9fb 46% 62%, #b8e3fd 62% 76%, #cdecfe 76%);
  }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  canvas { display: block; }

  /* ---------- 하늘 & 땅 ---------- */
  #sky { position: fixed; inset: 0; pointer-events: none; }
  #sky span { position: absolute; line-height: 0; animation: drift 10s ease-in-out infinite alternate; }
  #sky span:nth-child(2n) { animation-duration: 14s; }
  @keyframes drift { from { transform: translateX(-16px); } to { transform: translateX(16px); } }
  #ground { position: fixed; left: 0; right: 0; bottom: 0; height: 84px; pointer-events: none; display: none; }
  body.ground #ground { display: block; }
  #groundCv { position: absolute; left: 0; bottom: 0; image-rendering: pixelated; }
  #ground .sprite { position: absolute; bottom: 74px; line-height: 0; }

  /* ---------- 픽셀 테두리 공통 ---------- */
  .card {
    background: #fff;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
                0 9px 0 rgba(43,45,66,.18);
  }
  .pbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 15px; font-weight: 700; padding: 10px 18px; background: #fff;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink),
                inset 0 -4px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.6), 0 7px 0 rgba(43,45,66,.25);
  }
  .pbtn:active { transform: translateY(3px); }
  .pbtn.blue { background: var(--blue); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .pbtn.pink { background: var(--pink); color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .pbtn.sm { font-size: 13px; padding: 7px 12px; }

  .ribbon {
    display: inline-block; background: var(--pink); color: #fff; font-size: 13px; font-weight: 700;
    padding: 7px 24px; text-shadow: 1px 1px 0 rgba(43,45,66,.6);
    clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 50%, 100% 100%, 0 100%, 9px 50%);
  }
  .title {
    font-size: 32px; font-weight: 700; color: #fff; letter-spacing: 1px;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
                 3px 3px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink),
                 0 7px 0 var(--ink);
  }

  /* ---------- 화면 ---------- */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.active { display: flex; }
  .bar { position: relative; flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; }
  .bar .ribbon { position: absolute; left: 50%; transform: translateX(-50%); }
  .bar-r { display: flex; gap: 4px; align-items: center; min-width: 60px; justify-content: flex-end; }

  /* 그림 스타일 버튼 */
  .style-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; font-weight: 700; }
  .style-row > span { background: rgba(255,255,255,.75); padding: 4px 8px; }
  .seg { display: flex; background: #fff;
    box-shadow: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink), 0 6px 0 rgba(43,45,66,.2); }
  .seg button { font-size: 12px; font-weight: 700; padding: 7px 11px; }
  .seg button + button { box-shadow: -3px 0 0 var(--ink); }
  .seg button.on { background: var(--blue); color: #fff; text-shadow: 1px 1px 0 var(--ink); }

  /* 홈 */
  #home { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .home-in { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 12px 100px; }
  .stars { display: flex; gap: 8px; align-items: flex-end; }
  .stars span:nth-child(2) { transform: translateY(-6px); }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 24px; margin-top: 18px; max-width: 840px; }
  .choice { flex: none; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .choice .card { padding: 10px; }
  .choice .pv { width: 130px; height: 130px; display: grid; place-items: center; }
  .choice .pv canvas { max-width: 130px; max-height: 130px; width: auto; height: auto; }
  .choice:active .card { transform: translateY(3px); }

  /* 고르기 */
  .pick-main { flex: 1; display: grid; place-items: center; padding: 6px 20px 100px; min-height: 0; overflow-y: auto; }
  .grid { display: grid; gap: 18px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 8px 10px; }
  .tile canvas { width: 100%; height: auto; }
  .tile .nm { font-size: 14px; font-weight: 700; }
  .tile:active { transform: translateY(3px); }
  .tile.locked { background: #eef1f7; cursor: default; }
  .tile.locked:active { transform: none; }
  .tile .q { width: 100%; display: grid; place-items: center; color: #b6bccc; font-size: 30px; font-weight: 700; }
  .tile.locked .nm { color: #9aa1b5; }
  .tile .soon { font-size: 11px; color: #9aa1b5; margin-top: -4px; }

  /* 색칠 */
  .color-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 4px 20px 22px; }
  .color-main.land { flex-direction: row; gap: 28px; }
  .board { padding: 10px; }
  .palette { padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .now { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
  #nowSwatch { width: 30px; height: 30px; box-shadow: 0 0 0 3px var(--ink); }
  .swatches { display: grid; grid-template-columns: repeat(3, 54px); gap: 12px; }
  .color-main:not(.land) .swatches { grid-template-columns: repeat(10, 44px); gap: 10px; }
  .sw.rainbow { grid-column: span 3; aspect-ratio: auto; height: 54px; color: #fff; font-size: 14px; font-weight: 700;
    text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
  .color-main:not(.land) .sw.rainbow { grid-column: span 2; height: 44px; font-size: 12px; }
  .pbtn:disabled { opacity: .45; }
  .pbtn:disabled:active { transform: none; }
  .color-main:not(.land) .palette { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .sw { width: 100%; aspect-ratio: 1; box-shadow: 0 0 0 3px var(--ink), inset 0 -4px 0 rgba(0,0,0,.15); }
  .sw.sel { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px #fff, 0 0 0 9px var(--ink); }
  .tools { display: flex; gap: 14px; margin-top: 4px; }

  /* 틀린그림 */
  .spot-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 4px 20px 22px; }
  .spot-main.land { flex-direction: row; }
  .pic { position: relative; padding: 6px; }
  .pic canvas { touch-action: none; }
  .miss { position: absolute; font-size: 26px; font-weight: 700; color: #ff3b6b; pointer-events: none;
    transform: translate(-50%, -50%); text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
    animation: miss .7s ease-out forwards; }
  @keyframes miss { 0% { opacity: 1; transform: translate(-50%,-50%) scale(1.4); } 30% { transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; } }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .progress-row { flex: none; display: flex; justify-content: center; gap: 10px; margin-top: -8px; padding-bottom: 4px; }
  .progress-row span { line-height: 0; }
  .progress-row span.got { animation: starpop .45s ease-out; }
  @keyframes starpop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* 영어 놀이 */
  .pbtn.green { background: #3cb371; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .emoji { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .pv-eng { width: 130px; height: 130px; display: flex !important; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#cfeeff, #ffffff); }
  .pv-eng .e { font-size: 80px; line-height: 1.1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .pv-eng .w { font-size: 16px; font-weight: 700; color: var(--blue); }
  .tile .emo { width: 100%; display: grid; place-items: center; line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; background: linear-gradient(#e6f5ff, #fff); }
  .tile .en { font-size: 11px; color: #7a8099; margin-top: -4px; }
  .eng-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 4px 20px 22px; }
  .eng-main.land { flex-direction: row; gap: 30px; }
  .stage { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#e3f4ff, #ffffff 70%); }
  .stage .big { line-height: 1.05; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; position: relative; z-index: 1; }
  .stage .big.bounce { animation: bounce .7s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-12px) scale(1.06); } }
  .stage .word { font-size: 26px; font-weight: 700; margin-top: 8px; z-index: 1; transition: color .15s; }
  .stage .ko { font-size: 13px; color: #8a90a8; z-index: 1; }
  .stage .sent { font-size: 15px; margin-top: 8px; color: #4a5170; z-index: 1; text-align: center; padding: 0 60px; transition: color .15s; }
  .stage .speaking { color: var(--pink) !important; }
  .stage .sbtns { display: flex; gap: 16px; margin-top: 16px; z-index: 1; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; font-size: 18px; padding: 16px 12px; }
  .arrow:active { transform: translateY(calc(-50% + 3px)); }
  .arrow.l { left: 14px; } .arrow.r { right: 14px; }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fx i { position: absolute; top: -40px; font-style: normal; animation: drop linear infinite;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  @keyframes drop { to { transform: translateY(var(--fall)); } }
  .shakefx { animation: shake .35s 3; }
  .swayfx { animation: sway 1.4s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(-10deg) translateX(-12px); } }
  .thumbs { display: grid; grid-template-columns: repeat(2, var(--tw)); gap: 14px; }
  .eng-main:not(.land) .thumbs { grid-template-columns: repeat(4, var(--tw)); }
  .thumb { width: var(--tw); height: var(--tw); display: grid; place-items: center; font-size: calc(var(--tw) * .55); line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  .thumb.sel { background: #fff3b0; transform: translateY(-4px); }
  .thumb:active { transform: translateY(2px); }

  /* 옷입히기 */
  .pbtn.orange { background: #ff9f43; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  #dressBoard { position: relative; overflow: hidden; }
  #dressBoard .fx { inset: 10px; }
  .dpanel { padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; width: 372px;
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .dpanel > * { flex: none; }
  .color-main:not(.land) .dpanel { width: min(100%, 640px); }
  .dtabs { display: flex; gap: 6px; width: 100%; }
  .dtab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700;
    box-shadow: 0 0 0 2px var(--ink); background: #f3f5fa; }
  .dtab .emoji { font-size: 22px; line-height: 1.1; }
  .dtab.on { background: #fff3b0; transform: translateY(-2px); box-shadow: 0 0 0 3px var(--ink); }
  .ditems { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
  .color-main:not(.land) .ditems { grid-template-columns: repeat(6, 1fr); }
  .ditem { display: flex; flex-direction: column; align-items: center; padding: 4px 2px 6px; font-size: 11px; font-weight: 700; }
  .ditem canvas { width: 100%; max-width: 74px; height: auto; aspect-ratio: 1; }
  .ditem.on { background: #fff3b0; }
  .ditem:active { transform: translateY(2px); }
  .dpal-label { font-size: 11px; color: #7a8099; margin-bottom: -6px; }
  .dpal { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; width: 100%; }
  .dsw { aspect-ratio: 1; box-shadow: 0 0 0 2px var(--ink); font-size: 14px; font-weight: 700; background: #fff; }
  .dsw.sel { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px #fff, 0 0 0 6px var(--ink); }
  .mission { position: absolute; left: 18px; top: 18px; display: none; align-items: center; gap: 10px; padding: 8px 12px; z-index: 2;
    background: rgba(255,255,255,.92); box-shadow: 0 0 0 3px var(--ink), 0 5px 0 rgba(43,45,66,.2); }
  .mission.show { display: flex; }
  .memo { font-size: 40px; line-height: 1; animation: bounce 1s ease-in-out infinite; }
  .needs { display: flex; gap: 8px; }
  .need { position: relative; width: 46px; height: 46px; background: #f3f5fa; box-shadow: 0 0 0 2px #c9cedb; }
  .need canvas { width: 100%; height: 100%; opacity: .4; filter: grayscale(.8); }
  .need.ok { background: #e3f9df; box-shadow: 0 0 0 2px #3cb371; }
  .need.ok canvas { opacity: 1; filter: none; }
  .need b { position: absolute; right: -6px; top: -8px; background: #3cb371; color: #fff; font-size: 12px; width: 20px; height: 20px;
    display: grid; place-items: center; border-radius: 50%; box-shadow: 0 0 0 2px #fff; }
  @media (max-width: 560px) {
    .color-main:not(.land) .ditems { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .dpanel { padding: 10px; gap: 9px; }
    .mission { left: 10px; top: 10px; padding: 6px 8px; } .need { width: 36px; height: 36px; } .memo { font-size: 30px; }
  }

  /* 색칠 예시 */
  #colorBoard { position: relative; }
  .example { position: absolute; left: 16px; top: 16px; width: 24%; background: #fff; padding: 0; z-index: 2;
    box-shadow: 0 0 0 3px var(--ink), 0 5px 0 rgba(43,45,66,.2); transition: width .2s; }
  .example.big { width: 55%; }
  .example canvas { width: 100%; height: auto; display: block; }
  .example span { position: absolute; left: 0; top: 0; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 7px; }

  /* 새 버튼 색 */
  .pbtn.purple { background: #a26bff; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .pbtn.mint { background: #2bbfa8; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .pbtn.yellow { background: var(--yellow); color: var(--ink); }
  .pv-han .e { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-weight: 800; color: var(--pink); font-size: 72px; }
  .pv-han .w { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-weight: 700; color: var(--ink); }

  /* 아이스크림 */
  #iceBoard { position: relative; }

  /* 퍼즐 */
  .pz-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 4px 20px 22px; }
  .pz-main.land { flex-direction: row-reverse; }
  .pz-col { display: flex; flex-direction: column; gap: 18px; align-items: center; }
  .pz-main:not(.land) .pz-col { display: contents; }
  .pz-main:not(.land) .pz-ex { order: 1; align-self: flex-end; } .pz-main:not(.land) .pz-board { order: 2; }
  .pz-main:not(.land) .pz-tray { order: 3; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .pz-ex { position: relative; padding: 8px; }
  .pz-ex canvas { display: block; }
  .pz-ex .tag { position: absolute; left: 8px; top: 8px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 7px; z-index: 1; }
  .pz-board { padding: 6px; }
  .pz-board canvas { touch-action: none; }
  .pz-tray { padding: 10px; display: grid; gap: 8px; align-content: start; min-height: calc(var(--ph) + 20px); }
  .piece { width: var(--pw); height: var(--ph); padding: 0; box-shadow: 0 0 0 2px var(--ink), 0 4px 0 rgba(43,45,66,.2); background: #fff; }
  .piece canvas { width: 100%; height: 100%; display: block; }
  .piece.sel { transform: translateY(-5px) scale(1.06); box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px var(--yellow), 0 8px 0 rgba(43,45,66,.25); z-index: 1; }

  /* 한글 */
  .hanw { font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px !important; font-weight: 800; }
  .han-main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 4px 20px 22px; }
  .han-main.land { flex-direction: row; }
  .han-word { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 14px;
    background: linear-gradient(#fff7d6, #ffffff 70%); }
  .han-emo { line-height: 1.05; }
  .syls { display: flex; gap: 10px; }
  .syl { position: relative; width: var(--syl); height: var(--syl); display: grid; place-items: center; background: #fff;
    box-shadow: 0 0 0 3px #d9dce6; font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-weight: 800; font-size: calc(var(--syl) * .72); line-height: 1; }
  .syl span { grid-area: 1 / 1; }
  .syl .ghost { color: #dfe3ec; }
  .syl .fill { color: var(--ink); }
  .syl .part { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); }
  .syl.now { box-shadow: 0 0 0 3px var(--pink); animation: nowpulse 1.2s ease-in-out infinite; }
  @keyframes nowpulse { 50% { box-shadow: 0 0 0 6px rgba(255,107,154,.45); } }
  .syl.pop .fill { animation: starpop .4s ease-out; display: inline-block; }
  .han-en { font-size: 22px; font-weight: 700; color: var(--blue); min-height: 1.2em; opacity: 0; transform: translateY(8px); transition: .3s; }
  .han-en.show { opacity: 1; transform: none; }
  .han-field { position: relative; overflow: hidden; background: #ffffff; }
  .jamo { position: absolute; width: var(--tile); height: var(--tile); border-radius: 50%; background: #fff;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-weight: 800; font-size: calc(var(--tile) * .58); line-height: 1; color: var(--ink);
    box-shadow: 0 0 0 3px var(--ink), inset 0 -5px 0 rgba(0,0,0,.08), 0 5px 0 rgba(43,45,66,.2); transition: transform .25s, opacity .25s; }
  .jamo:nth-child(5n+1) { background: #ffe1ec; } .jamo:nth-child(5n+2) { background: #dff1ff; } .jamo:nth-child(5n+3) { background: #fff3c4; }
  .jamo:nth-child(5n+4) { background: #e3f9df; } .jamo:nth-child(5n) { background: #efe4ff; }
  .jamo.eaten { transform: scale(0); opacity: 0; pointer-events: none; }
  .jamo.hint { animation: hintglow .5s ease-in-out 3; }
  @keyframes hintglow { 50% { box-shadow: 0 0 0 3px var(--ink), 0 0 0 9px #ffd23f; transform: scale(1.12); } }
  @keyframes chomp { from { transform: scaleY(1); } to { transform: scaleY(.06); } }

  /* 옷입히기 배경 */
  .bgsw { width: 100%; aspect-ratio: 1; box-shadow: inset 0 0 0 2px rgba(43,45,66,.15); }
  .bg-room { background: linear-gradient(#fff3e6 0 58%, #e9c9a2 58% 62%, #d9b48a 62%) !important; }
  .bg-school { background: linear-gradient(#f6f1e4 0 56%, #c9a36b 56%) !important; }
  .bg-party_bg { background: radial-gradient(circle at 20% 20%, #ffd1e6 0 6%, transparent 6.5%), radial-gradient(circle at 80% 30%, #c9e8ff 0 5%, transparent 5.5%), radial-gradient(circle at 60% 15%, #fff3b0 0 4%, transparent 4.5%), linear-gradient(#ffe3f0 0 70%, #d9b4ff 70%) !important; }
  .bg-park { background: radial-gradient(circle at 70% 24%, #ffffff 0 9%, transparent 9.5%), radial-gradient(circle at 25% 18%, #ffffff 0 7%, transparent 7.5%), linear-gradient(#8fd3fb 0 62%, #8ad36a 62%) !important; }

//  그림 엔진: 도형으로 칸(영역)을 나누고, 칸 단위로 색을 칠해요
// =====================================================================
const INK = '#2b2d42';
const R = (k, x, y, w, h, c, o = {}) => ({ t: 'r', k, x, y, w, h, c, ...o });
const E = (k, x, y, rx, ry, c, o = {}) => ({ t: 'e', k, x, y, rx, ry, c, ...o });
const P = (k, pts, c, o = {}) => ({ t: 'p', k, pts, c, ...o });
const ink = (x, y, w, h, o = {}) => R('ink', x, y, w, h, null, { fix: INK, ...o });
const hl = (x, y, o = {}) => R('hl', x, y, 1, 1, null, { fix: '#ffffff', ...o });
// 좌우 대칭 (64칸 그림 기준)
const mirror = s => s.t === 'r' ? { ...s, x: 64 - s.x - s.w } : s.t === 'e' ? { ...s, x: 64 - s.x } : { ...s, pts: s.pts.map(([x, y]) => [64 - x, y]) };
const sym = s => [s, mirror(s)];
const starPts = (cx, cy, Ro, Ri) => Array.from({ length: 10 }, (_, i) => {
  const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? Ri : Ro;
  return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
});

function spriteSVG(name, px) {
  const rows = SPRITES[name], w = Math.max(...rows.map(r => r.length)), h = rows.length;
  let s = '';
  rows.forEach((r, y) => [...r].forEach((c, x) => { if (c !== '.') s += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${SP[c]}"/>`; }));
  return `<svg width="${w * px}" height="${h * px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${s}</svg>`;
}

function drawGround() {
  const px = 4, cv = $('groundCv'), W = Math.ceil(innerWidth / px) + 1, H = 21;
  cv.width = W; cv.height = H; cv.style.width = W * px + 'px'; cv.style.height = H * px + 'px';
  const c = cv.getContext('2d'), hash = (a, b) => ((a * 73856093) ^ (b * 19349663)) >>> 0;
  for (let x = 0; x < W; x++) {
    const top = (x >> 1) % 3 === 0 ? 0 : 1;
    for (let y = top; y < H; y++) {
      let col;
      if (y < 2) col = '#a2e86d';
      else if (y < 5) col = '#6cc04a';
      else if (y === 5) col = (x >> 1) % 2 ? '#4f9a36' : '#6cc04a';
      else col = hash(x >> 1, y >> 1) % 7 === 0 ? '#8a5530' : '#a86d3f';
      c.fillStyle = col; c.fillRect(x, y, 1, 1);
    }
  }
}

let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, start, dur, type = 'sine', vol = .25, slide) {
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}

  pop: () => tone(420, 0, .12, 'triangle', .3, 900),

  boop: () => tone(220, 0, .18, 'square', .07, 150),
  fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, i === 3 ? .5 : .16, 'square', .1)),
};

function layoutGrid(grid, cols, rows, aspect) {

let spot = null;
function startSpot(def) {
  // 이번 판에 쓸 틀린 곳 5개를 무작위로 골라요
  const all = [...new Set(def.shapes.filter(x => x.d !== undefined).map(x => x.d))];
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const active = new Set(all.slice(0, 5));
  const A = build(def, 'A', scaleOf(), active), B = build(def, 'B', scaleOf(), active);
  spot = { def, A, B, diffs: A.diffs, found: new Set() };
  $('spotTitle').textContent = `${def.name} 틀린그림찾기`;
  renderProgress();
  go('spot');
}
function renderProgress(pop) {
  $('progress').innerHTML = spot.diffs.map((_, i) =>
    `<span class="${pop && i === spot.found.size - 1 ? 'got' : ''}">${spriteSVG(spot.found.size > i ? 'star' : 'starOff', 3)}</span>`).join('');
}
function layoutSpot() {
  if (!spot) return;
  const m = $('spotMain'), W = m.clientWidth - 40, H = m.clientHeight - 26, gap = 20, pad = 12;
  const land = W / H > 1.1;
  m.classList.toggle('land', land);
  let pw, ph;
  if (land) { pw = Math.min((W - gap) / 2 - pad, (H - pad) * 1.5); ph = pw / 1.5; }
  else { ph = Math.min((H - gap) / 2 - pad, (W - pad) / 1.5); pw = ph * 1.5; }
  spot.cs = Math.floor(pw / 96 * 100) / 100;
  spot.ctxA = fitCanvas($('cvA'), spot.cs * 96, spot.cs * 64);
  spot.ctxB = fitCanvas($('cvB'), spot.cs * 96, spot.cs * 64);
  redrawSpot();
}
function ring(ctx, d, cs) {
  if (STYLE === 'smooth') {
    ctx.beginPath(); ctx.arc(d.x * cs, d.y * cs, d.r * cs, 0, Math.PI * 2);
    ctx.lineWidth = cs * 2.2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.lineWidth = cs * 1.1; ctx.strokeStyle = '#ff3b6b'; ctx.stroke();
    return;
  }
  for (let y = Math.floor(d.y - d.r - 2); y <= d.y + d.r + 2; y++)
    for (let x = Math.floor(d.x - d.r - 2); x <= d.x + d.r + 2; x++) {
      const dist = Math.hypot(x + .5 - d.x, y + .5 - d.y);
      if (Math.abs(dist - d.r) < .75) { ctx.fillStyle = '#ff3b6b'; ctx.fillRect(x * cs, y * cs, cs, cs); }
      else if (Math.abs(dist - d.r - 1) < .5 || Math.abs(dist - d.r + 1) < .5) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x * cs, y * cs, cs, cs); }
    }
}
function redrawSpot() {
  const o = { thin: Math.max(1, spot.cs * .3) };
  draw(spot.ctxA, spot.A, defaultColors(spot.A), spot.cs, o);
  draw(spot.ctxB, spot.B, defaultColors(spot.B), spot.cs, o);
  spot.found.forEach(i => { ring(spot.ctxA, spot.diffs[i], spot.cs); ring(spot.ctxB, spot.diffs[i], spot.cs); });
}
function spotTap(e) {
  if (!spot) return;
  const cv = e.currentTarget, r = cv.getBoundingClientRect();
  const gx = (e.clientX - r.left) / r.width * 96, gy = (e.clientY - r.top) / r.height * 64;
  let i = -1, best = 1e9;
  spot.diffs.forEach((d, k) => { const g = Math.hypot(gx - d.x, gy - d.y); if (!spot.found.has(k) && g <= d.r + 1.5 && g < best) { best = g; i = k; } });
  if (i >= 0) {
    spot.found.add(i); sfx.ding(); redrawSpot(); renderProgress(true);
    const word = (EN_SPOT[spot.def.id] || [])[spot.diffs[i].d];
    if (word) setTimeout(() => sayEn(word), 350);
    if (spot.found.size === spot.diffs.length) setTimeout(() => celebrate('다 찾았어요!', '눈이 정말 좋구나', [
      ['다시 하기', '', () => startSpot(spot.def)],
      ['다른 장소', 'pink', () => go('spotPick')],
    ]), 400);
  } else {
    sfx.boop();
    const m = document.createElement('span'); m.className = 'miss'; m.textContent = '✕';
    m.style.left = (e.clientX - r.left + 6) + 'px'; m.style.top = (e.clientY - r.top + 6) + 'px';
    cv.parentElement.appendChild(m); setTimeout(() => m.remove(), 700);
    cv.parentElement.classList.remove('shake'); void cv.offsetWidth; cv.parentElement.classList.add('shake');
  }
}

// ---------- 목소리 (아이패드에 들어 있는 음성) ----------
const canSpeak = 'speechSynthesis' in window;
const voices = { en: null, ko: null, loaded: false };
function loadVoices() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  const norm = v => v.lang.replace('_', '-').toLowerCase();
  const pick = (pre, exact, nice) => {
    const c = vs.filter(v => norm(v).startsWith(pre));
    return c.find(v => norm(v) === exact && /premium|enhanced|natural/i.test(v.name))
        || c.find(v => norm(v) === exact && nice.test(v.name))
        || c.find(v => norm(v) === exact) || c[0] || null;
  };
  voices.en = pick('en', 'en-us', /samantha|ava|allison|google us/i);
  voices.ko = pick('ko', 'ko-kr', /yuna|google/i);
  voices.loaded = true;
}
if (canSpeak) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
// parts: [{ t: 글, lang: 'ko'|'en', start, end }]
function say(parts, done) {
  if (!canSpeak) { done && done(); return; }
  speechSynthesis.cancel();
  if (!voices.loaded) loadVoices();
  const list = parts.filter(p => !(p.lang === 'ko' && voices.loaded && !voices.ko));
  list.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.t);
    u.lang = p.lang === 'ko' ? 'ko-KR' : 'en-US';
    if (voices[p.lang]) u.voice = voices[p.lang];
    u.rate = p.lang === 'en' ? .8 : .95; u.pitch = 1.1;
    u.onstart = () => p.start && p.start();
    u.onend = () => { p.end && p.end(); if (i === list.length - 1 && done) done(); };
    speechSynthesis.speak(u);
  });
}

}

function layoutEng() {

  const m = $('engMain'), W = m.clientWidth - 40, H = m.clientHeight - 30, gap = 14;
  const land = W > H * 1.15;
  m.classList.toggle('land', land);
  let tw, sw, sh;
  if (land) { tw = Math.floor(Math.min((H - gap * 3) / 4, 120)); sw = Math.min(W - tw * 2 - gap - 34, H * 1.25); sh = H; }
  else { tw = Math.floor(Math.min((W - gap * 3) / 4 - 8, 120)); sw = W; sh = Math.min(H - tw * 2 - gap - 30, W); }
  m.style.setProperty('--tw', tw + 'px');
  const st = $('stage'); st.style.width = sw + 'px'; st.style.height = sh + 'px';

}

      el.appendChild(Object.assign(document.createElement('i'), { style: 'display:none' }));
      (el._parts = el._parts || []).push(parts);

  });
  const f = $('hanField'); f.querySelectorAll('.jamo').forEach(el => el.remove());
  han.tiles.forEach(t => {

}
function updateHanWord() {
  const cnt = han.syls.map(() => 0);
  for (let k = 0; k < han.pos; k++) cnt[han.seq[k].si]++;
  const cur = han.pos < han.seq.length ? han.seq[han.pos].si : -1;
  [...$('hanSyls').children].forEach((el, si) => {
    (el._parts || []).forEach((parts, k) => parts.forEach(p => p.style.opacity = k < cnt[si] ? 1 : 0));
    el.classList.toggle('now', si === cur);

}
// 글자 안에서 초성·중성·종성이 차지하는 자리 (위 오른쪽 아래 왼쪽 % 로 잘라요)
function jamoRegions(ch) {
  const [, b, c] = splitSyl(ch), v = JUNG[b];
  const vert = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.includes(v), horiz = 'ㅗㅛㅜㅠㅡ'.includes(v);
  const bot = c ? 38 : 0;                // 받침이 있으면 아래 38%는 받침 자리
  let cho, jung;
  if (vert) { cho = [[0, 48, bot, 0]]; jung = [[0, 0, bot, 52]]; }
  else if (horiz) { const mid = c ? 34 : 50; cho = [[0, 0, 100 - mid, 0]]; jung = [[mid, 0, bot, 0]]; }
  else { const mid = c ? 34 : 50; cho = [[0, 46, 100 - mid, 0]]; jung = [[mid, 0, bot, 0], [0, 0, 100 - mid, 54]]; }
  const out = [cho, jung]; if (c) out.push([[100 - bot, 0, 0, 0]]);
  return out;
}
function cellXY(r, c) { const z = han.mz; return [z.ox + (c + .5) * z.cs, z.oy + (r + .5) * z.cs]; }
function placeAt(el, r, c, size) { const [x, y] = cellXY(r, c); el.style.left = (x - size / 2) + 'px'; el.style.top = (y - size / 2) + 'px'; }
function drawMaze() {
  const z = han.mz, ctx = z.ctx, W = z.W, cs = z.cs;
  ctx.clearRect(0, 0, z.fw, z.fh);
  const g = ctx.createLinearGradient(0, 0, 0, z.fh); g.addColorStop(0, '#1a1f4f'); g.addColorStop(1, '#2a2457');
  ctx.fillStyle = g; ctx.fillRect(0, 0, z.fw, z.fh);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  z.stars.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x * z.fw, y * z.fh, r, 0, 7); ctx.fill(); });
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, cs * .11);
  ctx.shadowColor = '#5aa0ff'; ctx.shadowBlur = cs * .35; ctx.strokeStyle = '#4f86ff';
  ctx.beginPath();
  for (let r = 0; r < z.R; r++) for (let c = 0; c < z.C; c++) {
    const w = W[r][c], x = z.ox + c * cs, y = z.oy + r * cs;
    if (w.t) { ctx.moveTo(x, y); ctx.lineTo(x + cs, y); }
    if (w.l) { ctx.moveTo(x, y); ctx.lineTo(x, y + cs); }
    if (w.b && r === z.R - 1) { ctx.moveTo(x, y + cs); ctx.lineTo(x + cs, y + cs); }
    if (w.r && c === z.C - 1) { ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs); }
  }
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.lineWidth = Math.max(1, cs * .04); ctx.strokeStyle = '#bcd4ff'; ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#ffe9a8';
  z.dots.forEach(k => { const [x, y] = cellXY((k / z.C) | 0, k % z.C); ctx.beginPath(); ctx.arc(x, y, Math.max(2, cs * .07), 0, 7); ctx.fill(); });
}
function tapJamo(t) {
  if (!han || han.busy || han.done || t.used) return;
  const need = han.seq[han.pos];
  if (t.j !== need.j) {
    sfx.boop(); han.miss++;
    t.el.classList.remove('shake'); void t.el.offsetWidth; t.el.classList.add('shake');
    if (han.miss >= 2) { const ok = han.tiles.find(x => !x.used && x.j === need.j); if (ok) { ok.el.classList.add('hint'); setTimeout(() => ok.el.classList.remove('hint'), 1500); } }
    return;
  }
  han.busy = true; han.miss = 0;
  const z = han.mz, path = bfsPath(z.W, z.at, t.cell), mun = $('muncher');
  let k = 1;
  const step = () => {
    if (k >= path.length) {
      t.used = true; t.el.classList.add('eaten');
      tone(330, 0, .07, 'square', .12); tone(220, .09, .07, 'square', .12);
      const si = need.si;
      han.pos++; updateHanWord();
      const sylDone = han.pos === han.seq.length || han.seq[han.pos].si !== si;
      const el = $('hanSyls').children[si];
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      han.busy = false;
      if (han.pos === han.seq.length) finishHan();
      else if (sylDone && han.syls.length > 1) say([{ t: han.syls[si], lang: 'ko' }]);
      return;
    }
    const [r, c] = path[k], [pr, pc] = path[k - 1];
    mun.classList.toggle('flip', c < pc);
    placeAt(mun, r, c, z.cs * .8); z.at = [r, c];
    const idx = z.dots.indexOf(r * z.C + c);
    if (idx >= 0) { z.dots.splice(idx, 1); tone(880 + (k % 2) * 120, 0, .05, 'sine', .08); drawMaze(); }
    k++; setTimeout(step, 150);
  };
  step();
}
function finishHan() {
  han.done = true;
  $('hanEn').textContent = `${han.ko} · ${han.en}`; $('hanEn').classList.add('show');
  sfx.ding();
  say([{ t: han.ko, lang: 'ko' }, { t: han.en, lang: 'en' }]);
  setTimeout(() => {
    celebrate('참 잘했어요!', `${han.ko} · ${han.en}`, [['다음 단어', 'pink', () => startHan((han.i + 1) % HAN_WORDS.length)], ['다른 단어', '', () => go('hanPick')]]);
  }, 1800);
}
$('hanSay').onclick = () => { if (han) say([{ t: han.ko, lang: 'ko' }, { t: han.en, lang: 'en' }]); };
function layoutHan() {
  if (!han) return;
  const m = $('hanMain'), Wm = m.clientWidth - 40, Hm = m.clientHeight - 30, gap = 22;
  const land = Wm > Hm * 1.1;
  m.classList.toggle('land', land);
  const wc = $('hanWordCard'), f = $('hanField');
  let ww, wh, fw, fh;
  if (land) { ww = Math.min(Wm * .36, 380); wh = Math.min(Hm, 520); fw = Wm - ww - gap; fh = Math.min(Hm, fw * .72); }
  else { ww = Wm; wh = Math.min(Hm * .36, 320); fw = Wm; fh = Hm - wh - gap; }
  wc.style.width = ww + 'px'; wc.style.height = wh + 'px';
  f.style.width = fw + 'px'; f.style.height = fh + 'px';
  $('hanEmo').style.fontSize = Math.floor(Math.min(ww, wh) * .3) + 'px';
  const box = Math.floor(Math.min((ww - 40) / han.syls.length - 10, wh * .3, 120));
  m.style.setProperty('--syl', box + 'px');
  // 미로 칸 수: 가로로 긴 화면이면 11x7, 세로면 7x9
  const C = fw > fh ? 11 : 7, R = fw > fh ? 7 : 9;
  const cs = Math.floor(Math.min((fw - 16) / C, (fh - 16) / R));
  const ox = Math.floor((fw - cs * C) / 2), oy = Math.floor((fh - cs * R) / 2);
  let z = han.mz;
  if (!z || z.C !== C || z.R !== R) {
    const W = genMaze(C, R), start = [(R / 2) | 0, (C / 2) | 0];
    const cells = shuffle([...Array(C * R).keys()]).filter(k => Math.abs(((k / C) | 0) - start[0]) + Math.abs(k % C - start[1]) >= 2);
    han.tiles.forEach((t, i) => t.cell = [(cells[i] / C) | 0, cells[i] % C]);
    const taken = new Set([start[0] * C + start[1], ...han.tiles.map(t => t.cell[0] * C + t.cell[1])]);
    z = han.mz = { C, R, W, at: start, dots: [...Array(C * R).keys()].filter(k => !taken.has(k)),
      stars: Array.from({ length: 30 }, () => [Math.random(), Math.random(), .6 + Math.random() * 1.2]) };
  }
  Object.assign(z, { cs, ox, oy, fw, fh });
  z.ctx = fitCanvas($('mazeCv'), fw, fh);
  m.style.setProperty('--tile', Math.floor(cs * .74) + 'px');
  han.tiles.forEach(t => placeAt(t.el, t.cell[0], t.cell[1], cs * .74));
  const mun = $('muncher'); mun.style.transition = 'none'; mun.style.width = mun.style.height = cs * .8 + 'px';
  placeAt(mun, z.at[0], z.at[1], cs * .8); void mun.offsetWidth; mun.style.transition = '';
  drawMaze();
}

// 저장: 공유 창 대신, 그림을 띄워서 꾹 눌러 '사진 앱에 저장'

  const ctx = cv.getContext('2d');
  draw(ctx, art, colors, cs, { soft: !!soft });

  const url = cv.toDataURL('image/png');

  $('celebrate').classList.remove('show');

}
